{{ define "main" }}
<section class="home-hero" aria-label="Introduction">
  <div class="hero-intro">{{ .Content }}</div>
  <div class="hero-socials" aria-label="Social profiles">
    <a class="icon-button" href="https://github.com/sandeshbhusal" aria-label="Sandesh on GitHub" title="GitHub">{{ partial "icons/github.html" . }}</a>
    <a class="icon-button" href="https://linkedin.com/in/sandeshbhusal" aria-label="Sandesh on LinkedIn" title="LinkedIn">{{ partial "icons/linkedin.html" . }}</a>
  </div>
</section>
<section class="recent-section" aria-labelledby="recent-title">
  <div class="section-heading">
    <h2 id="recent-title">Latest writing</h2>
    <a class="section-more" href="{{ "archives/" | relURL }}">All notes <span aria-hidden="true">→</span></a>
  </div>
  <div class="note-list">{{ range first (site.Params.recentCount | default 5) (where site.RegularPages "Section" "notes").ByDate.Reverse }}{{ partial "row.html" . }}{{ end }}</div>
</section>
{{ end }}
