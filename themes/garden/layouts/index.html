{{ define "main" }}
{{ partial "globe.html" . }}
<section class="site-intro">{{ .Content }}</section>
<section class="recent-section"><div class="section-heading"><h2>Recent posts</h2><a class="text-link" href="{{ "archives/" | relURL }}">All posts ↗</a></div><div class="note-list">{{ range first (site.Params.recentCount | default 5) (where site.RegularPages "Section" "notes").ByDate.Reverse }}{{ partial "row.html" . }}{{ end }}</div></section>
{{ end }}
