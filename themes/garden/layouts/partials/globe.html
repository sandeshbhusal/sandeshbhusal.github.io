<section class="knowledge-graph" aria-label="Knowledge graph"><div class="globe-aura" aria-hidden="true"></div><div class="globe-wrap"><canvas tabindex="0" role="img" aria-label="Rotating knowledge graph. Drag to rotate, scroll or pinch to zoom; click a node to read. Use the controls below for keyboard navigation."></canvas></div><div class="graph-toolbar"><span class="graph-stats"></span><div class="graph-options"><select aria-label="Filter graph by topic"><option value="">All topics</option></select><select aria-label="Open a graph note"><option value="">Open a note</option>{{ range (where site.RegularPages "Section" "notes").ByDate.Reverse }}<option value="{{ .RelPermalink }}">{{ .Title }}</option>{{ end }}</select><button class="icon-button" data-graph="out" aria-label="Zoom out">−</button><output class="zoom-value" aria-label="Graph zoom">100%</output><button class="icon-button" data-graph="in" aria-label="Zoom in">+</button><button class="icon-button" data-graph="pause" aria-label="Pause graph">Ⅱ</button><button class="icon-button" data-graph="reset" aria-label="Reset graph view">↺</button></div></div><noscript><p class="graph-fallback">Explore the garden: {{ range where site.RegularPages "Section" "notes" }}<a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}</p></noscript></section>
