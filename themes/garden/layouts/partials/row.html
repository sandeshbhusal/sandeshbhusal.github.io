<div class="note-row" data-date="{{ .Date.Format "2006-01-02" }}" data-title="{{ .Title }}" data-tags="{{ .Params.tags | jsonify }}"><div class="note-info"><div class="note-title-line"><a class="note-title" data-preview href="{{ .RelPermalink }}">{{ .Title }}</a></div><p>{{ .Params.summary }}</p><div class="note-mobile-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time><span>·</span><span>{{ .ReadingTime }} min read</span></div></div><div class="note-right"><div class="note-tags">{{ range first 1 (.GetTerms "tags") }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></div><a class="row-arrow" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">↗</a></div>
