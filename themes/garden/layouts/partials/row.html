<article class="note-row" data-date="{{ .Date.Format "2006-01-02" }}" data-title="{{ .Title }}" data-tags="{{ .Params.tags | jsonify }}">
  <div class="note-main">
    <h3 class="note-title-line"><a class="note-title" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Params.summary }}<p class="note-summary">{{ . }}</p>{{ else }}<p class="note-summary">{{ .Summary | plainify | truncate 160 }}</p>{{ end }}
    <div class="note-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <span class="note-sep" aria-hidden="true">·</span>
      <span>{{ .ReadingTime }} min read</span>
      {{ range first 1 (.GetTerms "tags") }}<span class="note-sep" aria-hidden="true">·</span><a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
    </div>
  </div>
</article>
